<!doctype html>
<html><head><meta charset="utf-8"><title>Icon</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  .icon { width: 1024px; height: 1024px; position: relative; background: linear-gradient(160deg, #3b6cf6 0%, #2746c9 55%, #1b2f8f 100%); overflow: hidden; }
  .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 65%); left: -250px; top: -300px; }
  .grid { position: absolute; inset: 132px; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
  .tile { border-radius: 72px; display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.6); }
  .tile svg { width: 66%; height: 66%; }
</style></head>
<body>
<div class="icon">
  <div class="glow"></div>
  <div class="grid">
    <div class="tile" style="background:#fdf0a8"><svg viewBox="0 0 24 24"><path d="M4 18h16l1.2-9-4.6 3.2L12 5l-4.6 7.2L2.8 9z" fill="#e0a300"/><rect x="4" y="19" width="16" height="2.5" rx="1" fill="#e0a300"/></svg></div>
    <div class="tile" style="background:#ffe6c4"><svg viewBox="0 0 48 24"><circle cx="12" cy="12" r="8.5" fill="#f5a623"/><path d="M38.8 3.3a8.7 8.7 0 1 0 6 15.4 10.2 10.2 0 0 1-6-15.4z" fill="#5b7cc4"/></svg></div>
    <div class="tile" style="background:#dfe9ff"><svg viewBox="0 0 40 24" fill="none"><path d="M6 6h14v12h14" stroke="#2563eb" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="6" r="4.8" fill="#1b1f2a"/><circle cx="34" cy="18" r="4.8" fill="#1b1f2a"/></svg></div>
    <div class="tile" style="background:#e3f5dc"><svg viewBox="0 0 40 24"><rect x="1" y="1" width="16" height="22" rx="3" fill="#f7a8a8"/><rect x="19" y="1" width="20" height="10" rx="3" fill="#b3b8f5"/><rect x="19" y="13" width="9" height="10" rx="3" fill="#a6e39a"/><rect x="30" y="13" width="9" height="10" rx="3" fill="#fbc978"/></svg></div>
  </div>
</div>
</body></html>
