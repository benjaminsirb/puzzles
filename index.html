<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Puzzles</title>
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Puzzles">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <div class="bar">
    <div class="timer" id="timer">0:00</div>
    <div class="bar-right">
      <select id="size" class="size" hidden></select>
      <button id="new" class="btn">New</button>
    </div>
  </div>
  <div id="board" class="board"></div>
  <div id="actions" class="actions"></div>
  <p id="rules" class="rules"></p>
  <p id="seed" class="seed"></p>
</main>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
