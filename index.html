<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Puzzles</title>
<meta name="description" content="Queens, Tango, Zip and Patches. Unlimited puzzles, offline, no account.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Puzzles">
<meta property="og:title" content="Puzzles">
<meta property="og:description" content="Queens, Tango, Zip and Patches. Unlimited puzzles, offline, no account.">
<meta property="og:url" content="https://benjaminsirb.com/puzzles/">
<meta property="og:image" content="https://benjaminsirb.com/puzzles/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Four mini puzzle boards: Queens, Tango, Zip and Patches">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Puzzles">
<meta name="twitter:description" content="Queens, Tango, Zip and Patches. Unlimited puzzles, offline, no account.">
<meta name="twitter:image" content="https://benjaminsirb.com/puzzles/og.png">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Puzzles">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <div class="bar">
    <div class="timer" id="timer">0:00</div>
    <div class="bar-right">
      <select id="size" class="size" hidden></select>
      <button id="stats" class="btn ghost" title="Results">Stats</button>
      <button id="new" class="btn">New</button>
    </div>
  </div>
  <div class="stage">
    <div id="board" class="board"></div>
    <div id="cover" class="cover" hidden>
      <div class="cover-card">
        <h2 id="cover-title"></h2>
        <p id="cover-sub"></p>
        <button id="cover-btn" class="btn">Start game</button>
      </div>
    </div>
  </div>
  <div id="actions" class="actions"></div>
  <p id="rules" class="rules"></p>
  <p id="seed" class="seed"></p>
</main>
<canvas id="confetti" class="confetti" hidden></canvas>
<div id="modal" class="modal" hidden>
  <div class="card">
    <div class="trophy"><svg viewBox="0 0 24 24"><path d="M4 18h16l1.2-9-4.6 3.2L12 5l-4.6 7.2L2.8 9z"/><rect x="4" y="19" width="16" height="2.5" rx="1"/></svg></div>
    <h2 id="modal-title">Nice work!</h2>
    <p id="modal-sub"></p>
    <button id="modal-results" class="link">View results</button>
    <div class="row">
      <button id="modal-close" class="btn ghost">Close</button>
      <button id="modal-new" class="btn">New puzzle</button>
    </div>
  </div>
</div>
<div id="results" class="modal" hidden>
  <div class="card wide">
    <div class="results-head">
      <h2>Results</h2>
      <button id="results-close" class="btn ghost small">Close</button>
    </div>
    <div class="pills" id="results-games"></div>
    <div class="pills" id="results-sizes"></div>
    <div class="tiles" id="results-tiles"></div>
    <div class="chart-wrap">
      <svg id="results-chart" class="chart" viewBox="0 0 360 200" preserveAspectRatio="none"></svg>
      <div id="results-tip" class="tip" hidden></div>
    </div>
    <div class="table-wrap"><table id="results-table" class="table"></table></div>
    <button id="results-clear" class="link danger">Clear history</button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
